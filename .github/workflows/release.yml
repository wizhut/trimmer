name: Release

# Tag-driven: pushing v<x.y.z> cross-compiles every platform, packages the
# archives and publishes them as a GitHub release. `make tag` does the push.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # --generate-notes diffs against the previous tag

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The `version` const in main.go is the single source of truth — the
      # Makefile scrapes it for the archive names, so a tag that disagrees would
      # publish v1.2.0 archives called trimmer-...-1.1.0.tar.gz.
      - name: Check the tag matches the version const
        run: |
          tag="${GITHUB_REF_NAME#v}"
          const="$(sed -n 's/^const version = "\(.*\)"/\1/p' main.go)"
          if [ "$tag" != "$const" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version const \"$const\" in main.go"
            exit 1
          fi

      - run: make vet
      - run: make test
      - run: make release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "trimmer $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/*-checksums.txt
